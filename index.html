<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Explorer</title>
    <meta
      name="description"
      content="Discover the world - countries, landmarks and nature, with an interactive atlas, a 3D globe and time travel."
    />

    <!-- Installable app (PWA). See docs/PWA.md. -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b111c" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS ignores the web manifest for these, so they must be declared here. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Explorer" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Global Explorer" />
    <meta property="og:title" content="Global Explorer" />
    <meta
      property="og:description"
      content="Discover the world - countries, landmarks and nature, with an interactive atlas, a 3D globe and time travel."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
