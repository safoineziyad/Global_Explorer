# Netlify configuration for Global Explorer (Vite + React Router SPA).
# Full per-host guide: docs/DEPLOY.md

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# SPA deep-link fallback: a path that is not a real file is served the app
# shell with HTTP 200 so react-router resolves /country/DEU, /landmark/x,
# /privacy, ... on the client instead of the host returning a hard 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Security + privacy hardening -----------------------------------------
# No 'unsafe-eval' and no 'unsafe-inline' for scripts. If the build ever adds
# an inline bootstrap script, give it a SHA-256 hash here (see REQUESTS.md).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://flagcdn.com; font-src 'self'; connect-src 'self' https://restcountries.com; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"

# --- Caching ---------------------------------------------------------------
# Vite emits content-hashed files under /assets, so they are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The HTML shell must revalidate so a new deploy is picked up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
